[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magicsquare-07"
version = "0.1.0"
description = "Magic Square 4x4 TDD practice project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyQt6>=6.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["magicsquare*"]

